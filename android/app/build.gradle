// EoW Recomp for Android: libmain.so (the runtime) + libSDL3.so, built by app/CMakeLists.txt (needs
// tools/android/build_deps.sh first). No game code in here: libeowgame.so is built from the player's own game files
// by tools/android/build_game.sh and packed into a personal APK (-PeowGameLib=<dir with arm64-v8a/libeowgame.so>).
// (After LASRecomp-Android-Plus, MIT.)
plugins {
    id 'com.android.application'
}

def sdl = file('../../build/android/SDL3/android-project/app/src/main/java')
// -PonDeviceBuild=true: the APK builds the game code on the phone from the player's own game files (python, zig and
// the generator's libraries as lib*.so - extracted at install: Android runs programs only from the native library
// folder - + assets/ondevice.zip and the license texts, all from tools/android/ondevice/build_all.sh: build/ondevice/).
// Dev builds can leave it out.
def onDevice = (project.findProperty('onDeviceBuild') ?: 'false') == 'true'
def ondev = file('../../build/ondevice')
if (onDevice && !(new File(ondev, 'stage/jniLibs/arm64-v8a/libzig.so').exists() && new File(ondev, 'assets/ondevice.zip').exists()))
    throw new GradleException('-PonDeviceBuild: run tools/android/ondevice/build_all.sh first')

android {
    namespace 'com.eowrecomp.android'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.eowrecomp.android'
        minSdk 30          // Android 11: Vulkan 1.1+, AAudio, MAP_FIXED_NOREPLACE kernels
        targetSdk 36
        versionCode((project.findProperty('eowVersionCode') ?: '1') as int)
        versionName project.findProperty('eowVersionName') ?: '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        manifestPlaceholders = [extractNativeLibs: onDevice ? 'true' : 'false']
        externalNativeBuild {
            cmake {
                targets 'main', 'SDL3-shared'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    // A release key for APKs you share: android/keystore.properties with storeFile, storePassword, keyAlias,
    // keyPassword (never commit it or the key). Without it, release builds use the local debug key (personal builds).
    def keystoreProps = rootProject.file('keystore.properties')
    signingConfigs {
        if (keystoreProps.exists()) {
            release {
                def p = new Properties()
                keystoreProps.withInputStream { p.load(it) }
                storeFile file(p.getProperty('storeFile'))
                storePassword p.getProperty('storePassword')
                keyAlias p.getProperty('keyAlias')
                keyPassword p.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreProps.exists() ? signingConfigs.release : signingConfigs.debug
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        debug {
            // the runtime is unusably slow at -O0: keep debug info but optimize
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            buildStagingDirectory file('../../build/android/cxx')
        }
    }

    sourceSets {
        main {
            java.srcDirs += [sdl]
            assets.srcDirs += ["$buildDir/generated/eow-assets"]
            // a personal build with the game code inside (tools/android/build_game.sh --apk)
            if (project.hasProperty('eowGameLib')) jniLibs.srcDirs += [project.property('eowGameLib')]
            if (onDevice) {
                jniLibs.srcDirs += ["$ondev/stage/jniLibs"]
                assets.srcDirs += ["$ondev/assets"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // stored uncompressed and mapped directly from the APK; the on-phone build: compressed in the APK and
            // extracted at install (its programs must be files to run)
            useLegacyPackaging onDevice
        }
    }
}

// What the app ships besides code (runtime/paths.c android_resources): the start screen fonts and the icon
tasks.register('eowAssets', Sync) {  // (Sync: a file gone from the sources goes from the APK too)
    from('../../third_party/fonts') { include '**/*.ttf'; eachFile { path = name }; includeEmptyDirs = false }
    from('../../docs/icon/icon_1024.png') { rename { 'icon.png' } }
    into "$buildDir/generated/eow-assets"
}
preBuild.dependsOn eowAssets

// The on-phone build's kit and asset archive again from this checkout's sources (quick: python and zig stay built), so
// the headers and the generator inside the APK are the ones its game code id (tools/android/gamelib_id.sh) is made from
if (onDevice) {
    tasks.register('eowOnDeviceAssets', Exec) {
        workingDir file('../..')
        commandLine 'bash', '-c', 'tools/android/ondevice/build_cckit.sh && tools/android/ondevice/make_assets.sh'
    }
    preBuild.dependsOn eowOnDeviceAssets
}
